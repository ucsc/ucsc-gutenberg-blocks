schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: PHP 8.1, WordPress (Gutenberg blocks), React (via @wordpress/element), vanilla JS, wp-scripts build toolchain.
  Three custom Gutenberg blocks: Campus Directory (ucscblocks/campusdirectory), Class Schedule (ucscblocks/classschedule), Course Catalog (ucscblocks/coursecatalog).
  All blocks use server-side rendering (save: null); block attributes persist editor config only.
  REST API: namespace ucsc/v1 proxies PeopleSoft course data; namespace ucscgutenbergblocks/v1 serves Campus Directory config.
  Data caching: all upstream API and LDAP results cached via WordPress transients.
  A code test coverage report should be available for both PHP and JS.
  JS coverage: npm run test:coverage (jest with @wordpress/scripts, config in jest-unit.config.js, output in coverage/).
  PHP coverage: phpunit with coverage (see tests/php/); test files are CampusDirectoryTest.php, ClassScheduleTest.php, CourseCatalogTest.php.

